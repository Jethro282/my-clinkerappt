<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Guess the Clinker Colour!</title>
<style>
:root{--cream:#fff7ec;--ink:#31231e}*{box-sizing:border-box}body{margin:0;padding:28px 14px 40px;background:var(--cream);font-family:Arial,Helvetica,sans-serif;color:var(--ink);text-align:center}h1{font-size:clamp(1.55rem,5vw,2.4rem);margin:8px 0 14px}.scoreboard{font-size:1.15rem;font-weight:700;margin-bottom:8px}.stage{position:relative;width:min(100%,480px);height:265px;margin:0 auto 10px;overflow:hidden}.clinker{position:absolute;width:174px;height:174px;right:42px;top:48px;border-radius:50%;background:radial-gradient(circle at 30% 24%,#9c623b 0%,#75411f 32%,#4b2512 75%,#321608 100%);box-shadow:inset -12px -12px 15px #29120770,0 10px 12px #48280f25;overflow:hidden}.clinker:before{content:"";position:absolute;inset:14px 27px auto 20px;height:45px;border-radius:50%;background:#ffffff18;transform:rotate(-24deg)}.centre{display:none;position:absolute;inset:28px;border-radius:50%;box-shadow:inset -7px -8px 12px #0002}.bite{display:none;position:absolute;left:-18px;top:45px;width:89px;height:89px;border-radius:50%;background:var(--cream)}.mouth{position:absolute;width:150px;height:145px;left:0;top:58px;z-index:3;display:none;pointer-events:none;filter:drop-shadow(0 6px 3px #0002)}.mouth svg{width:100%;height:100%;overflow:visible}.mouth .top,.mouth .bottom{transform-box:fill-box;transform-origin:84% 90%}.mouth .bottom{transform-origin:84% 10%}.mouth .pupil{transform-origin:center}.mouth.play{display:block;animation:approach 3s linear forwards}.mouth.play .top{animation:topChomp .56s ease-in-out infinite alternate}.mouth.play .bottom{animation:bottomChomp .56s ease-in-out infinite alternate}.mouth.play .pupil{animation:eyeWiggle .36s ease-in-out infinite alternate}.mouth.big .top{animation:bigTop .38s ease-out forwards}.mouth.big .bottom{animation:bigBottom .38s ease-out forwards}.mouth.big{animation:none;left:calc(100% - 286px)}@keyframes approach{from{left:-165px}to{left:calc(100% - 286px)}}@keyframes topChomp{from{transform:rotate(-11deg)}to{transform:rotate(8deg)}}@keyframes bottomChomp{from{transform:rotate(10deg)}to{transform:rotate(-9deg)}}@keyframes bigTop{from{transform:rotate(-12deg)}to{transform:rotate(13deg)}}@keyframes bigBottom{from{transform:rotate(12deg)}to{transform:rotate(-14deg)}}@keyframes eyeWiggle{from{transform:translate(-3px,1px)}to{transform:translate(4px,-2px)}}.controls{margin:5px auto;max-width:480px}button{border:0;border-radius:12px;background:#5e3726;color:#fff;font-weight:700;font-size:1rem;padding:12px 18px;margin:5px;cursor:pointer;box-shadow:0 3px 0 #3c2117}button:hover{background:#78472f}button:disabled{opacity:.55;cursor:not-allowed}button.choice{background:#eee0cc;color:#34241e;box-shadow:0 3px 0 #d1baa0}button.choice.selected{outline:3px solid #8e57b8;background:#ead6f5}#result{font-size:1.2rem;font-weight:700;min-height:54px;padding:10px}small{color:#765c4e}
</style>
</head>
<body>
<h1>Guess the Clinker Colour!</h1>
<div class="scoreboard">Score: <span id="score">0</span> &nbsp;|&nbsp; Streak: <span id="streak">0</span></div>
<div class="stage" aria-label="A cartoon mouth approaches a chocolate Clinker and takes a bite">
  <div class="mouth" id="mouth" aria-hidden="true">
    <svg viewBox="0 0 170 150" xmlns="http://www.w3.org/2000/svg">
      <!-- The jaw shapes pivot independently, like a cartoon hinge. -->
      <g class="top">
        <path d="M10 87 Q8 43 42 30 Q92 10 145 45 Q159 56 157 79 L151 89 Q110 76 68 87 Q33 97 10 87Z" fill="#24252d" stroke="#111118" stroke-width="4"/>
        <path d="M18 76 Q29 47 68 37 Q109 27 143 51" fill="none" stroke="#717587" stroke-width="5" stroke-linecap="round" opacity=".75"/>
        <path d="M84 83 Q105 75 123 79 L123 103 Q114 113 102 103 L99 85Z" fill="#fff6e8" stroke="#242127" stroke-width="2"/>
        <path d="M123 80 Q139 79 151 85 L151 102 Q138 111 125 103Z" fill="#fff6e8" stroke="#242127" stroke-width="2"/>
      </g>
      <g class="bottom">
        <path d="M11 88 Q31 101 69 95 Q113 86 155 92 Q158 119 134 133 Q79 157 38 129 Q16 115 11 88Z" fill="#24252d" stroke="#111118" stroke-width="4"/>
        <path d="M28 104 Q70 115 111 103 Q86 124 52 123Z" fill="#8e2937"/>
        <path d="M90 91 Q103 85 118 92 L118 111 Q107 120 95 111Z" fill="#fff6e8" stroke="#242127" stroke-width="2"/>
        <path d="M121 90 Q137 86 150 93 L149 110 Q135 118 122 109Z" fill="#fff6e8" stroke="#242127" stroke-width="2"/>
        <path d="M26 123 Q78 153 134 126" fill="none" stroke="#555660" stroke-width="4" opacity=".5"/>
      </g>
      <g class="eye">
        <circle cx="96" cy="27" r="22" fill="white" stroke="#181821" stroke-width="4"/>
        <circle class="pupil" cx="103" cy="29" r="10" fill="#111116"/>
        <circle cx="107" cy="24" r="3" fill="white"/>
      </g>
    </svg>
  </div>
  <div class="clinker" id="clinker"><div class="centre" id="centre"></div><div class="bite" id="bite"></div></div>
</div>
<div class="controls">
  <div><button class="choice" data-colour="pink">Pink</button><button class="choice" data-colour="yellow">Yellow</button><button class="choice" data-colour="green">Green</button></div>
  <div><button id="reveal">Reveal</button><button id="reset">Reset Clinker</button></div>
</div>
<div id="result" role="status" aria-live="polite"></div>
<small>Choose a colour, then press Reveal!</small>
<script>
const colours={pink:'#ff69b4',yellow:'#ffd400',green:'#4caf50'};
const mouth=document.getElementById('mouth'),centre=document.getElementById('centre'),bite=document.getElementById('bite'),result=document.getElementById('result');
const choices=[...document.querySelectorAll('.choice')];
let answer,guess=null,phase='ready',score=0,streak=0,timers=[];
function schedule(fn,ms){const id=setTimeout(fn,ms);timers.push(id)}
function resetClinker(){timers.forEach(clearTimeout);timers=[];answer=Object.keys(colours)[Math.floor(Math.random()*3)];guess=null;phase='ready';mouth.className='mouth';mouth.style.display='none';centre.style.display='none';bite.style.display='none';result.textContent='';choices.forEach(b=>{b.classList.remove('selected');b.disabled=false});document.getElementById('reveal').disabled=false}
function selectGuess(colour){if(phase==='animating')return;if(phase==='done')resetClinker();guess=colour;choices.forEach(b=>b.classList.toggle('selected',b.dataset.colour===colour));result.textContent=colour.charAt(0).toUpperCase()+colour.slice(1)+' selected';}
function playCrunch(){try{const AudioContext=window.AudioContext||window.webkitAudioContext;if(!AudioContext)return;const ctx=new AudioContext();const length=Math.floor(ctx.sampleRate*.16);const buffer=ctx.createBuffer(1,length,ctx.sampleRate);const samples=buffer.getChannelData(0);for(let i=0;i<length;i++)samples[i]=(Math.random()*2-1)*Math.pow(1-i/length,2);const src=ctx.createBufferSource();src.buffer=buffer;const filter=ctx.createBiquadFilter();filter.type='lowpass';filter.frequency.value=1100;const gain=ctx.createGain();gain.gain.value=.17;src.connect(filter).connect(gain).connect(ctx.destination);src.start();src.onended=()=>ctx.close()}catch(e){}}
function reveal(){if(phase==='animating'||phase==='done'){result.textContent='Press Reset Clinker, or choose a colour to start the next round.';return}if(!guess){result.textContent='Please choose a colour first!';return}phase='animating';result.textContent='Here comes the chomp!';choices.forEach(b=>b.disabled=true);document.getElementById('reveal').disabled=true;mouth.style.display='block';mouth.className='mouth';void mouth.offsetWidth;mouth.className='mouth play';schedule(()=>{mouth.className='mouth big';result.textContent='BIG CHOMP!';playCrunch()},3000);schedule(()=>{mouth.className='mouth';mouth.style.display='none';bite.style.display='block';centre.style.background=colours[answer];centre.style.display='block';phase='done';if(guess===answer){score++;streak++;result.textContent='🎉 Correct!'}else{streak=0;result.textContent='❌ Wrong! It was '+answer+'.'}document.getElementById('score').textContent=score;document.getElementById('streak').textContent=streak;choices.forEach(b=>b.disabled=false);document.getElementById('reveal').disabled=false},3440)}
choices.forEach(b=>b.addEventListener('click',()=>selectGuess(b.dataset.colour)));
document.getElementById('reveal').addEventListener('click',reveal);
document.getElementById('reset').addEventListener('click',resetClinker);
resetClinker();
</script>
</body>
</html>
